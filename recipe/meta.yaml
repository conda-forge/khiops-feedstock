{% set name = "khiops" %}
{% set version = "11.0.1.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/96/45/540269d73dd717b9999c4684c75628da084a96afef56a7d388d54dfc4957/{{ name }}-{{ version }}.tar.gz
  sha256: 8ba11b516d0a55b8328e145b6c2581943fd6b315a9d2b405adf06136014e9ebe

build:
  entry_points:
    - kh-status=khiops.tools:kh_status_entry_point
    - kh-samples=khiops.tools:kh_samples_entry_point
    - kh-download-datasets=khiops.tools:kh_download_datasets_entry_point
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --ignore-installed --no-cache-dir --no-build-isolation -vvv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}
    - khiops-core =11.0.1
    - pandas >=2.3.3,<4.0.0
    - scikit-learn >=1.7.2,<1.9.0
  run_constrained:
    # Do not necessarily use the latest versions to avoid undesired breaking
    # changes
    # Use the same constraints as in the upstreaam pyproject.toml
    - boto3 >=1.17.39,<=1.35.69
    - google-cloud-storage >=1.37.0
    - azure-core >=1.39.0,<2.0.0
    - azure-storage-blob >=12.28.0,<13.0.0
    - azure-storage-file-share >=12.24.0,<13.0.0

test:
  imports:
    - khiops
  commands:
    - kh-status
    - kh-samples --help
    - kh-download-datasets --help
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://khiops.org
  summary: Python library for the Khiops AutoML suite
  license: BSD-3-Clause
  license_file: LICENSE.md
  doc_url: https://khiops.org
  dev_url: https://github.com/khiopsml/khiops-python

extra:
  recipe-maintainers:
    - popescu-v
    - tramora
    - bruno-at-orange
